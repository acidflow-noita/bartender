name: Cook recipe previews
on:
  workflow_dispatch:
  push:
    tags: ['cook-recipe-previews-*']

permissions:
  contents: write

concurrency:
  group: cook-recipe-previews
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.13.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run recipes:render -- --jobs 4
      - run: npm run recipes:pack
      - name: Publish the verified media and both catalog files
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recipe-media-archives.mjs publish --with-catalog
