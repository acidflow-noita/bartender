name: Archive published recipe media
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-published-recipe-media.yml']
    tags: ['archive-published-recipes-*']

# Recover a release from already-served files on initial setup or explicit request.
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.13.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the published bytes and upload the prebuilt archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recipe-media-archives.mjs archive-published
